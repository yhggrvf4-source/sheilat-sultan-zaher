
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شيلات سلطان زاهر</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{
 padding:28px 12px;background:#172b45;
 border-bottom:3px solid #d5a33d
}
h1{color:#f4c65e;font-size:27px}
.logo{
 color:#fff;font-size:18px;
 animation:glow 2s infinite alternate
}
@keyframes glow{
 from{text-shadow:0 0 4px gold}
 to{text-shadow:0 0 18px orange}
}
main{padding:20px}
.song{
 background:#1d2b40;margin:15px 0;
 padding:18px;border-radius:14px;
 border:1px solid #46536a
}
.song h3{color:#f4c65e}
button{
 background:#d6a63c;color:#111;
 border:0;border-radius:9px;
 padding:12px 25px;font-size:17px;
 font-weight:bold
}
audio{width:100%;margin-top:15px}
footer{padding:25px;color:#f4c65e}
</style>
</head>
<body>
<header>
<h1>🎵 شيلات سلطان زاهر 🎵</h1>
<div class="logo">✦ المصمم يونس تميم ✦</div>
</header>
<main>
<h2>مكتبة الشيلات</h2>
<div class="song">
<h3>شيلات سلطان زاهر</h3>
<p>استمع إلى الشيلات الحصرية</p>
<audio controls preload="metadata">
<source src="audio/1.mp3" type="audio/mpeg">
</audio>
</div>
</main>
<footer>جميع الحقوق محفوظة © سلطان زاهر</footer>
</body>
</html>
